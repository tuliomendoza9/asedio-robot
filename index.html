<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ASEDIO ROBOT</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0b1020; overflow: hidden; }
  /* OJO iPhone: 100vh mide la pantalla SIN la barra de Safari, y el borde de
     abajo del juego quedaba fuera. height 100%/100dvh + padding de safe-area
     mantienen todo dentro de lo visible (isla dinamica y rayita de inicio). */
  @supports (height: 100dvh) { html, body { height: 100dvh; } }
  body {
    box-sizing: border-box;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
             env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  #unity-canvas { width: 100%; height: 100%; display: block; background: #0b1020; }
  #pantalla-carga {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: #0b1020;
    font-family: Arial, Helvetica, sans-serif; z-index: 10;
  }
  #titulo { color: #ffffff; font-size: clamp(34px, 9vw, 64px); font-weight: bold; letter-spacing: 2px; }
  #lema { color: #9fb4ff; font-size: clamp(15px, 4vw, 22px); margin-top: 12px; }
  #barra {
    width: min(64vw, 420px); height: 14px; margin-top: 48px;
    background: #232a44; border-radius: 7px; overflow: hidden;
  }
  #relleno { width: 0%; height: 100%; background: #ffc93c; transition: width 0.15s ease; }
  #estado { color: #5a6a9a; font-size: 13px; margin-top: 14px; }
</style>
</head>
<body>
<div id="pantalla-carga">
  <div id="titulo">ASEDIO ROBOT</div>
  <div id="lema">Robots atacan. Humanos defienden.</div>
  <div id="barra"><div id="relleno"></div></div>
  <div id="estado">descargando...</div>
</div>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<script>
  // OJO iPhone/Safari: el navegador crea el audio "dormido" y el despertador
  // automatico de Unity falla a veces en iOS -> el juego queda MUDO.
  // Capturamos todo AudioContext que se cree y lo despertamos al primer toque.
  (function () {
    var contextos = [];
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    function ACVigilado() {
      var ctx = arguments.length ? new AC(arguments[0]) : new AC();
      contextos.push(ctx);
      return ctx;
    }
    ACVigilado.prototype = AC.prototype;
    window.AudioContext = ACVigilado;
    if (window.webkitAudioContext) window.webkitAudioContext = ACVigilado;
    // El INTERRUPTOR fisico de silencio del iPhone mutea los juegos web.
    // Truco conocido: un <audio> en bucle silencioso reclasifica la sesion
    // como "reproduccion" y el juego suena aunque el interruptor este en rojo.
    var etiquetaAudio = null;
    function activarSesionAudio() {
      if (etiquetaAudio) return;
      var a = document.createElement("audio");
      a.setAttribute("playsinline", "");
      a.loop = true;
      a.src = "data:audio/wav;base64,UklGRuwAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YcgAAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==";
      var p = a.play();
      if (p && p.catch) p.catch(function () {});
      etiquetaAudio = a;
    }
    function despertar() {
      activarSesionAudio();
      // iOS ademas usa el estado "interrupted" (llamada, Siri, bloquear pantalla)
      for (var i = 0; i < contextos.length; i++)
        if (contextos[i].state !== "running" && contextos[i].state !== "closed") {
          var p = contextos[i].resume();
          if (p && p.catch) p.catch(function () {});
        }
    }
    ["touchstart", "touchend", "pointerdown", "mousedown", "keydown"].forEach(function (ev) {
      document.addEventListener(ev, despertar, true);
    });
  })();

  // Registro de las llamadas al servidor: si una falla queda escrita en la
  // consola con su codigo. Sin esto los fallos de red del juego son mudos.
  // OJO: Unity 6 usa fetch para UnityWebRequest, asi que hay que vigilar AMBOS.
  (function () {
    var fetchOriginal = window.fetch;
    if (!fetchOriginal) return;
    window.fetch = function (recurso, opciones) {
      var url = typeof recurso === "string" ? recurso : (recurso && recurso.url) || "";
      var metodo = (opciones && opciones.method) || (recurso && recurso.method) || "GET";
      return fetchOriginal.apply(this, arguments).then(function (respuesta) {
        if (String(url).indexOf("supabase") >= 0) {
          var corto = String(url).replace(/^https:\/\/[^/]+/, "");
          window.__redAsedio = window.__redAsedio || [];
          window.__redAsedio.push({m: metodo, url: corto, estado: respuesta.status});
          if (!respuesta.ok)
            respuesta.clone().text().then(function (t) {
              console.warn("RED ASEDIO " + metodo + " " + corto + " -> " + respuesta.status + " " + t.slice(0, 200));
            });
        }
        return respuesta;
      }).catch(function (e) {
        if (String(url).indexOf("supabase") >= 0)
          console.warn("RED ASEDIO " + metodo + " " + url + " -> SIN RESPUESTA " + e);
        throw e;
      });
    };
  })();

  (function () {
    var abrir = XMLHttpRequest.prototype.open;
    var enviar = XMLHttpRequest.prototype.send;
    window.__redAsedio = [];
    XMLHttpRequest.prototype.open = function (metodo, url) {
      this.__metodo = metodo; this.__url = url;
      return abrir.apply(this, arguments);
    };
    XMLHttpRequest.prototype.send = function () {
      var xhr = this;
      xhr.addEventListener("loadend", function () {
        if (!xhr.__url || String(xhr.__url).indexOf("supabase") < 0) return;
        var corto = String(xhr.__url).replace(/^https:\/\/[^/]+/, "");
        window.__redAsedio.push({m: xhr.__metodo, url: corto, estado: xhr.status,
                                 cuerpo: (xhr.responseText || "").slice(0, 200)});
        if (xhr.status < 200 || xhr.status >= 300)
          console.warn("RED ASEDIO " + xhr.__metodo + " " + corto + " -> " + xhr.status + " " + (xhr.responseText || "").slice(0, 200));
      });
      return enviar.apply(this, arguments);
    };
  })();
</script>
<script src="Build/WebGL_v17.loader.js"></script>
<script>
  createUnityInstance(document.querySelector("#unity-canvas"), {
    arguments: [],
    dataUrl: "Build/WebGL_v17.data.unityweb",
    frameworkUrl: "Build/WebGL_v17.framework.js.unityweb",
    codeUrl: "Build/WebGL_v17.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "Tulio Mendoza",
    productName: "ASEDIO ROBOT",
    productVersion: "0.11.1",
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
  }, function (progreso) {
    document.querySelector("#relleno").style.width = (progreso * 100) + "%";
    document.querySelector("#estado").textContent =
      progreso < 0.9 ? "descargando... " + Math.round(progreso * 100) + "%" : "arrancando el motor...";
  }).then(function () {
    document.querySelector("#pantalla-carga").style.display = "none";
  }).catch(function (mensaje) {
    document.querySelector("#estado").textContent = "Error: " + mensaje;
  });
</script>
</body>
</html>
