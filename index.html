<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ASEDIO ROBOT</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0b1020; overflow: hidden; }
  /* OJO iPhone: 100vh mide la pantalla SIN la barra de Safari, y el borde de
     abajo del juego quedaba fuera. height 100%/100dvh + padding de safe-area
     mantienen todo dentro de lo visible (isla dinamica y rayita de inicio). */
  @supports (height: 100dvh) { html, body { height: 100dvh; } }
  body {
    box-sizing: border-box;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
             env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  #unity-canvas { width: 100%; height: 100%; display: block; background: #0b1020; }
  #pantalla-carga {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: #0b1020;
    font-family: Arial, Helvetica, sans-serif; z-index: 10;
  }
  #titulo { color: #ffffff; font-size: clamp(34px, 9vw, 64px); font-weight: bold; letter-spacing: 2px; }
  #lema { color: #9fb4ff; font-size: clamp(15px, 4vw, 22px); margin-top: 12px; }
  #barra {
    width: min(64vw, 420px); height: 14px; margin-top: 48px;
    background: #232a44; border-radius: 7px; overflow: hidden;
  }
  #relleno { width: 0%; height: 100%; background: #ffc93c; transition: width 0.15s ease; }
  #estado { color: #5a6a9a; font-size: 13px; margin-top: 14px; }
</style>
</head>
<body>
<div id="pantalla-carga">
  <div id="titulo">ASEDIO ROBOT</div>
  <div id="lema">Robots atacan. Humanos defienden.</div>
  <div id="barra"><div id="relleno"></div></div>
  <div id="estado">descargando...</div>
</div>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<script src="Build/WebGL_v12.loader.js"></script>
<script>
  createUnityInstance(document.querySelector("#unity-canvas"), {
    arguments: [],
    dataUrl: "Build/WebGL_v12.data.unityweb",
    frameworkUrl: "Build/WebGL_v12.framework.js.unityweb",
    codeUrl: "Build/WebGL_v12.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "Tulio Mendoza",
    productName: "ASEDIO ROBOT",
    productVersion: "0.8.0",
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
  }, function (progreso) {
    document.querySelector("#relleno").style.width = (progreso * 100) + "%";
    document.querySelector("#estado").textContent =
      progreso < 0.9 ? "descargando... " + Math.round(progreso * 100) + "%" : "arrancando el motor...";
  }).then(function () {
    document.querySelector("#pantalla-carga").style.display = "none";
  }).catch(function (mensaje) {
    document.querySelector("#estado").textContent = "Error: " + mensaje;
  });
</script>
</body>
</html>
